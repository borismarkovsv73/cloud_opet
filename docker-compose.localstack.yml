services:
  postgres:
    image: postgres:16-alpine
    container_name: cloud-bronze-postgres
    environment:
      POSTGRES_DB: gold
      POSTGRES_USER: gold_app
      POSTGRES_PASSWORD: gold_password
    ports:
      - "5432:5432"
    volumes:
      - ./.postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gold_app -d gold"]
      interval: 10s
      timeout: 5s
      retries: 5

  superset:
    image: apache/superset:4.0.2
    container_name: cloud-bronze-superset
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: change-me-in-development
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SQLALCHEMY_DATABASE_URI: sqlite:////app/superset_home/superset.db
      SUPERSET_LOAD_EXAMPLES: "no"
      PYTHONPATH: /app/pythonpath
    volumes:
      - superset_home:/app/superset_home
      - ./superset:/app/pythonpath
    command: >
      /bin/sh -c "superset db upgrade &&
      superset fab create-admin --username admin --firstname Superset --lastname Admin --email admin@example.com --password admin || true &&
      superset init &&
      superset run -h 0.0.0.0 -p 8088"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8088/health')\"" ]
      interval: 10s
      timeout: 5s
      retries: 20

  localstack:
    image: localstack/localstack:3.4
    container_name: cloud-bronze-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,lambda,logs,events,iam,sts,cloudwatch
      - DEBUG=1
      - PERSISTENCE=1
      - AWS_DEFAULT_REGION=us-east-1
      - LAMBDA_EXECUTOR=docker-reuse
      - LAMBDA_RUNTIME_ENVIRONMENT_TIMEOUT=120
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.localstack:/var/lib/localstack
      - ./localstack/init:/etc/localstack/init/ready.d

volumes:
  superset_home:
